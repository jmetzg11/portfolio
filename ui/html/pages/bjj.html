{{define "title"}}BJJ{{end}}

{{define "main"}}
<h1>BJJ Reference</h1>
<ul>
    {{range .BJJTechniques}}
    <li>
        <h2>{{.Name}}</h2>
        <p>{{.Position}}</p>
        {{if .YouTube}}
            <a href="{{.YouTube}}" target="_blank" rel="noopener noreferrer">YouTube</a>
        {{else}}
            <p>{{.Description}}</p>
        {{end}}
    </li>
    {{end}}
</ul>
{{end}}
