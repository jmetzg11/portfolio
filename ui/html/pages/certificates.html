{{define "title"}}Certificates{{end}}

{{define "main"}}
<h1>Education &amp; Certificates</h1>
<ul>
    {{range .Certificates}}
    <li>
        <h2>{{.Name}}</h2>
        <span>{{.Date}}</span>
        <p>{{.Description}}</p>
        <img src="{{.Image}}" alt="Certificate: {{.Name}}" loading="lazy">
    </li>
    {{end}}
</ul>
{{end}}
