{{define "title"}}Home{{end}}

{{define "main"}}
<header>
    <img src="/static/img/profile.jpeg" alt="Jesse Metzger">
    <h1>Jesse Metzger</h1>
</header>

<h2>Projects</h2>
<ul>
    {{range .Projects}}
    <li>
        {{if .External}}
            <a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Name}}</a>
        {{else}}
            <a href="{{.URL}}">{{.Name}}</a>
        {{end}}
        <p>{{.Description}}</p>
        {{if .CodeURL}}
            <a href="{{.CodeURL}}" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="{{$.GithubIcon}}" />
                </svg>
                View code
            </a>
        {{end}}
    </li>
    {{end}}
</ul>
{{end}}
